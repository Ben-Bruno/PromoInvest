<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tontine Live</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
    margin:0;
    font-family:'Poppins', sans-serif;
    background:#0f172a;
    color:white;
    text-align:center;
}

.container {
    max-width:500px;
    margin:auto;
    padding:20px;
}

.timer {
    font-size:2.5rem;
    margin:20px;
    color:#22c55e;
}

input {
    width:80%;
    padding:12px;
    border-radius:8px;
    border:none;
    margin:5px;
}

button {
    padding:12px;
    border:none;
    border-radius:8px;
    margin:5px;
    font-weight:bold;
    cursor:pointer;
}

.join {background:#3b82f6;}
.play {background:#22c55e;}
.reset {background:#f59e0b;}
.about {background:#64748b;}

.card {
    background:#1e293b;
    padding:10px;
    margin:5px;
    border-radius:8px;
}

footer {
    margin-top:30px;
    font-size:0.8rem;
    color:#94a3b8;
}

/* Modal */
.modal {
    display:none;
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.7);
    justify-content:center;
    align-items:center;
}

.modal-content {
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    max-width:300px;
}

.modal a {
    color:#38bdf8;
    display:block;
    margin-top:8px;
}
</style>
</head>

<body>

<div class="container">

<h1><i class="fa-solid fa-users"></i> PROMO INVEST </h1>

<div class="timer" id="timer">00:00:00</div>

<input id="name" placeholder="Votre nom">
<button class="join" onclick="join()">
<i class="fa-solid fa-user-plus"></i> Valider
</button>

<div id="players"></div>

<br>

<input id="adminCode" placeholder="Code admin">

<input id="minutes" placeholder="Minutes">
<input id="seconds" placeholder="Secondes">

<button class="play" onclick="start()">
<i class="fa-solid fa-play"></i> Lancer
</button>

<button class="reset" onclick="resetGame()">
<i class="fa-solid fa-rotate-left"></i> Reset
</button>

<button class="about" onclick="openModal()">
<i class="fa-solid fa-user"></i> À propos
</button>

<div id="results"></div>

<footer>
© Bruno BENGONO — Tous droits réservés. Toute reproduction ou copie est strictement interdite.
</footer>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-content">
<h3>👨‍💻 Développeur</h3>
<p><strong>Bruno BENGONO</strong></p>
<p>🇫🇷 Limoges, France</p>
<p>Ingénieur Traitement du Signal & IA/ML</p>
<p>Stagiaire chez CISTEME</p>

<a href="mailto:bengonob@3il.fr"><i class="fa-solid fa-envelope"></i> Email</a>
<a href="https://linkedin.com/in/bruno-bengono" target="_blank"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>
<a href="https://github.com/Ben-Bruno" target="_blank"><i class="fa-brands fa-github"></i> GitHub</a>

<button onclick="closeModal()">Fermer</button>
</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// CONFIG FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyBkJ__vfMpFCsfgf2VMcJ41JSp8femrZmg",
  authDomain: "promoinvest-4abfc.firebaseapp.com",
  databaseURL: "https://promoinvest-4abfc-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "promoinvest-4abfc",
  storageBucket: "promoinvest-4abfc.firebasestorage.app",
  messagingSenderId: "1089423001172",
  appId: "1:1089423001172:web:6e119db8200d9e13d20fc1"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const ADMIN_CODE = "140692228";

// participants temps réel
onValue(ref(db,"players"), snap=>{
    let data = snap.val() || {};
    let html = "<h3>Participants</h3>";

    Object.values(data).forEach(p=>{
        html += `<div class="card">${p}</div>`;
    });

    document.getElementById("players").innerHTML = html;
});

// timer + résultats
onValue(ref(db,"game"), snap=>{
    let data = snap.val();
    if(!data) return;

    document.getElementById("timer").innerText = data.timer;

    if(data.results){
        let html = "<h3>Classement</h3>";
        data.results.forEach((n,i)=>{
            html += `<div class="card">${i+1} - ${n}</div>`;
        });
        document.getElementById("results").innerHTML = html;
    }
});

// rejoindre
window.join = function(){
    let name = document.getElementById("name").value.trim();
    if(!name) return alert("Entrez un nom");

    push(ref(db,"players"), name);
    document.getElementById("name").value="";
};

// lancer
window.start = function(){

    let code = document.getElementById("adminCode").value;
    if(code !== ADMIN_CODE){
        alert("Code incorrect");
        return;
    }

    let min = parseInt(document.getElementById("minutes").value) || 0;
    let sec = parseInt(document.getElementById("seconds").value) || 0;

    let duration = min*60 + sec;
    if(duration <= 0) return alert("Temps invalide");

    let interval = setInterval(()=>{
        duration--;

        let t = new Date(duration * 1000).toISOString().substr(11,8);
        set(ref(db,"game/timer"), t);

        if(duration <= 0){
            clearInterval(interval);

            onValue(ref(db,"players"), snap=>{
                let players = Object.values(snap.val() || {});

                for(let i=players.length-1;i>0;i--){
                    let j=Math.floor(Math.random()*(i+1));
                    [players[i],players[j]]=[players[j],players[i]];
                }

                set(ref(db,"game"), {
                    timer:"GO 🔥",
                    results:players
                });
            }, {onlyOnce:true});
        }

    },1000);
};

// RESET ADMIN
window.resetGame = function(){

    let code = document.getElementById("adminCode").value;

    if(code !== ADMIN_CODE){
        alert("Code incorrect");
        return;
    }

    if(!confirm("⚠️ Réinitialiser complètement la tontine ?")){
        return;
    }

    remove(ref(db,"players"));
    remove(ref(db,"game"));

    document.getElementById("timer").innerText = "00:00:00";
    document.getElementById("results").innerHTML = "";
};

// modal
window.openModal = ()=>document.getElementById("modal").style.display="flex";
window.closeModal = ()=>document.getElementById("modal").style.display="none";

</script>

</body>
</html>
